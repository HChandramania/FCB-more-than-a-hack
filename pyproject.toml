[project]
name = "possession-mtah2027"
version = "1.0.0"
description = "Per-frame ball possession (home, away, dead) from automatic tracking data, for the More than a Hack 2027 challenge"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "lightgbm==4.7.0",
    "numba==0.66.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "torch==2.13.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
